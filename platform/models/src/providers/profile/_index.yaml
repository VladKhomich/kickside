version: "1.0"
namespace: kickside.models.providers.profile
entries:
  - name: status
    kind: function.lua
    source: file://driver.lua
    method: status
    modules: [ctx, registry]
    imports:
      model_catalog: kickside.models.catalog:model_catalog
      models_repo: kickside.models.persist:repo
      catalog_policy: kickside.models.catalog:policy
      providers: wippy.llm.discovery:providers
    security:
      policies: [kickside.models.catalog:catalog_read, kickside.models.catalog:catalog_database, kickside.models.catalog:catalog_key, kickside.models.providers.profile:provider_contract, kickside.models.providers.profile:provider_call, kickside.models.providers.profile:provider_context]
  - name: generate
    kind: function.lua
    source: file://driver.lua
    method: generate
    modules: [ctx, registry]
    imports:
      model_catalog: kickside.models.catalog:model_catalog
      models_repo: kickside.models.persist:repo
      catalog_policy: kickside.models.catalog:policy
      providers: wippy.llm.discovery:providers
    security:
      policies: [kickside.models.catalog:catalog_read, kickside.models.catalog:catalog_database, kickside.models.catalog:catalog_key, kickside.models.providers.profile:provider_contract, kickside.models.providers.profile:provider_call, kickside.models.providers.profile:provider_context]
  - name: embed
    kind: function.lua
    source: file://driver.lua
    method: embed
    modules: [ctx, registry]
    imports:
      model_catalog: kickside.models.catalog:model_catalog
      models_repo: kickside.models.persist:repo
      catalog_policy: kickside.models.catalog:policy
      providers: wippy.llm.discovery:providers
    security:
      policies: [kickside.models.catalog:catalog_read, kickside.models.catalog:catalog_database, kickside.models.catalog:catalog_key, kickside.models.providers.profile:provider_contract, kickside.models.providers.profile:provider_call, kickside.models.providers.profile:provider_context]
  - name: structured_output
    kind: function.lua
    source: file://driver.lua
    method: structured_output
    modules: [ctx, registry]
    imports:
      model_catalog: kickside.models.catalog:model_catalog
      models_repo: kickside.models.persist:repo
      catalog_policy: kickside.models.catalog:policy
      providers: wippy.llm.discovery:providers
    security:
      policies: [kickside.models.catalog:catalog_read, kickside.models.catalog:catalog_database, kickside.models.catalog:catalog_key, kickside.models.providers.profile:provider_contract, kickside.models.providers.profile:provider_call, kickside.models.providers.profile:provider_context]
  - name: evaluate
    kind: function.lua
    source: file://driver.lua
    method: evaluate
    modules: [ctx, registry]
    imports:
      model_catalog: kickside.models.catalog:model_catalog
      models_repo: kickside.models.persist:repo
      catalog_policy: kickside.models.catalog:policy
      providers: wippy.llm.discovery:providers
    security:
      policies: [kickside.models.catalog:catalog_read, kickside.models.catalog:catalog_database, kickside.models.catalog:catalog_key, kickside.models.providers.profile:provider_contract, kickside.models.providers.profile:provider_call, kickside.models.providers.profile:provider_context]
  - name: provider_contract
    kind: security.policy
    meta: {private: true}
    policy:
      resources: [wippy.llm:provider]
      actions: [contract.get]
      effect: allow
  - name: provider_call
    kind: security.policy
    meta: {private: true}
    policy:
      resources: [status, generate, embed, structured_output, evaluate]
      actions: [contract.call]
      effect: allow
  - name: provider_context
    kind: security.policy
    meta: {private: true}
    policy:
      resources: [context]
      actions: [contract.context]
      effect: allow
