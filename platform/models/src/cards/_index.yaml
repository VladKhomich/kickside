version: "1.0"
namespace: kickside.models.cards

# The model cards contract. This namespace is outside the member module grant
# (kickside.models.security:module_runtime); a module calls it only through
# kickside.models.security:card_registrar.

entries:
  - name: database_config_read
    kind: security.policy
    meta:
      private: true
      comment: Read the Models database binding when retiring or deleting a stored card.
    policy:
      resources: [kickside.models:db_config]
      actions: [registry.get]
      effect: allow

  - name: cards
    kind: contract.definition
    meta:
      title: Model Cards
      description: Register, retire and delete model cards without the admin HTTP surface. Upserts share the PUT /models/cards save path. Retirement keeps the stored row; deleting a retired card removes it. Both refresh the cache.
    methods:
      - name: upsert_card
        description: upsert_card(card) -> { success, model?, error? }. Creates or updates the card by name; omitted fields keep the saved values.
        input_schemas:
          - definition: |
              { "type": "object",
                "properties": {
                  "name": { "type": "string", "minLength": 1 },
                  "title": { "type": "string" },
                  "description": { "type": "string" },
                  "provider_id": { "type": "string", "description": "Provider entry id" },
                  "provider_profile_id": { "type": "string", "description": "Provider profile the card routes through" },
                  "provider_model": { "type": "string", "description": "Model name at the provider" },
                  "capabilities": { "type": "array", "items": { "type": "string" } },
                  "class": { "type": "array", "items": { "type": "string" } },
                  "priority": { "type": "number" },
                  "max_tokens": { "type": "number" },
                  "output_tokens": { "type": "number" },
                  "dimensions": { "type": "number" },
                  "pricing": { "type": "object" },
                  "options": { "type": "object" },
                  "source": { "type": "string" },
                  "enabled": { "type": "boolean" },
                  "metadata": {
                    "type": "object",
                    "properties": {
                      "train": {
                        "type": "object",
                        "properties": {
                          "weights_digest": { "type": "string" },
                          "manifest_sha256": { "type": "string" },
                          "lineage": { "description": "Parent cards, datasets and runs the weights derive from" }
                        },
                        "required": ["weights_digest", "manifest_sha256"]
                      }
                    }
                  }
                },
                "required": ["name"] }
            format: application/schema+json
        output_schemas:
          - definition: |
              { "type": "object",
                "properties": { "success": { "type": "boolean" }, "model": { "type": "object" }, "error": { "type": "string" } },
                "required": ["success"] }
            format: application/schema+json
      - name: disable_card
        description: disable_card({ name }) -> { success, model?, error? }. Disables a stored card and keeps its row; disabling a disabled card succeeds.
        input_schemas:
          - definition: |
              { "type": "object",
                "properties": { "name": { "type": "string", "minLength": 1 } },
                "required": ["name"] }
            format: application/schema+json
        output_schemas:
          - definition: |
              { "type": "object",
                "properties": { "success": { "type": "boolean" }, "model": { "type": "object" }, "error": { "type": "string" } },
                "required": ["success"] }
            format: application/schema+json
      - name: delete_card
        description: delete_card({ name }) -> { success, error? }. Deletes a stored card that is disabled; an enabled card is in use and is refused, so a caller retires a card with disable_card before deleting it.
        input_schemas:
          - definition: |
              { "type": "object",
                "properties": { "name": { "type": "string", "minLength": 1 } },
                "required": ["name"] }
            format: application/schema+json
        output_schemas:
          - definition: |
              { "type": "object",
                "properties": { "success": { "type": "boolean" }, "error": { "type": "string" } },
                "required": ["success"] }
            format: application/schema+json

  - name: upsert_card
    kind: function.lua
    meta:
      comment: cards contract -- create or update a card by name through the shared card service.
    source: file://cards_contract.lua
    method: upsert_card
    imports:
      card_service: kickside.models.catalog:card_service
      policy: kickside.models.catalog:policy
    security:
      policies:
        - kickside.models.catalog:catalog_database
        - kickside.models.catalog:catalog_read
        - kickside.models.catalog:provider_binding_read
        - kickside.models:reload_profiles_call

  - name: disable_card
    kind: function.lua
    meta:
      comment: cards contract -- retire a stored card and keep its row.
    source: file://cards_contract.lua
    method: disable_card
    imports:
      card_service: kickside.models.catalog:card_service
      policy: kickside.models.catalog:policy
    security:
      policies:
        - kickside.models.cards:database_config_read
        - kickside.models.catalog:catalog_database
        - kickside.models:reload_profiles_call

  - name: delete_card
    kind: function.lua
    meta:
      comment: cards contract -- delete a retired stored card.
    source: file://cards_contract.lua
    method: delete_card
    imports:
      card_service: kickside.models.catalog:card_service
      policy: kickside.models.catalog:policy
    security:
      policies:
        - kickside.models.cards:database_config_read
        - kickside.models.catalog:catalog_database
        - kickside.models:reload_profiles_call

  - name: cards_binding
    kind: contract.binding
    meta:
      title: Model Cards Service
      comment: Canonical implementation of kickside.models.cards:cards.
    contracts:
      - contract: kickside.models.cards:cards
        default: true
        methods:
          upsert_card: kickside.models.cards:upsert_card
          disable_card: kickside.models.cards:disable_card
          delete_card: kickside.models.cards:delete_card
