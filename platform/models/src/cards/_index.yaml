version: "1.0"
namespace: kickside.models.cards

# The model cards contract. This namespace is outside the member module grant
# (kickside.models.security:module_runtime); a module calls it only through
# kickside.models.security:card_registrar.

entries:
  - name: card_writer_runtime
    kind: security.policy
    meta:
      private: true
      comment: Card contract functions read and write the models database and publish the cache snapshot under their own scope.
    policy:
      resources: '*'
      actions: [registry.get, db.get, store.get, store.key.get, store.key.set, store.key.delete]
      effect: allow

  - name: cards
    kind: contract.definition
    meta:
      title: Model Cards
      description: Register and retire model cards without the admin HTTP surface. Writes use the same path as PUT /models/cards and publish the same cache snapshot.
    methods:
      - name: upsert_card
        description: upsert_card(card) -> { success, model?, error? }. Creates or updates the card by name; omitted fields keep the saved values.
        input_schemas:
          - definition: |
              { "type": "object",
                "properties": {
                  "name": { "type": "string", "minLength": 1 },
                  "title": { "type": "string" },
                  "description": { "type": "string" },
                  "provider_id": { "type": "string", "description": "Provider entry id" },
                  "provider_profile_id": { "type": "string", "description": "Provider profile the card routes through" },
                  "provider_model": { "type": "string", "description": "Model name at the provider" },
                  "capabilities": { "type": "array", "items": { "type": "string" } },
                  "class": { "type": "array", "items": { "type": "string" } },
                  "priority": { "type": "number" },
                  "max_tokens": { "type": "number" },
                  "output_tokens": { "type": "number" },
                  "dimensions": { "type": "number" },
                  "pricing": { "type": "object" },
                  "options": { "type": "object" },
                  "source": { "type": "string" },
                  "enabled": { "type": "boolean" },
                  "metadata": {
                    "type": "object",
                    "properties": {
                      "train": {
                        "type": "object",
                        "properties": {
                          "weights_digest": { "type": "string" },
                          "manifest_sha256": { "type": "string" },
                          "lineage": { "description": "Parent cards, datasets and runs the weights derive from" }
                        },
                        "required": ["weights_digest", "manifest_sha256"]
                      }
                    }
                  }
                },
                "required": ["name"] }
            format: application/schema+json
        output_schemas:
          - definition: |
              { "type": "object",
                "properties": { "success": { "type": "boolean" }, "model": { "type": "object" }, "error": { "type": "string" } },
                "required": ["success"] }
            format: application/schema+json
      - name: disable_card
        description: disable_card({ name }) -> { success, model?, error? }. Disables a stored card and keeps its row; disabling a disabled card succeeds.
        input_schemas:
          - definition: |
              { "type": "object",
                "properties": { "name": { "type": "string", "minLength": 1 } },
                "required": ["name"] }
            format: application/schema+json
        output_schemas:
          - definition: |
              { "type": "object",
                "properties": { "success": { "type": "boolean" }, "model": { "type": "object" }, "error": { "type": "string" } },
                "required": ["success"] }
            format: application/schema+json

  - name: upsert_card
    kind: function.lua
    meta:
      comment: cards contract -- create or update a card by name through the shared card service.
    source: file://cards_contract.lua
    method: upsert_card
    imports:
      card_service: kickside.models.catalog:card_service
    security:
      policies:
        - kickside.models.cards:card_writer_runtime

  - name: disable_card
    kind: function.lua
    meta:
      comment: cards contract -- disable a stored card through the shared card service.
    source: file://cards_contract.lua
    method: disable_card
    imports:
      card_service: kickside.models.catalog:card_service
    security:
      policies:
        - kickside.models.cards:card_writer_runtime

  - name: cards_binding
    kind: contract.binding
    meta:
      title: Model Cards Service
      comment: Canonical implementation of kickside.models.cards:cards.
    contracts:
      - contract: kickside.models.cards:cards
        default: true
        methods:
          upsert_card: kickside.models.cards:upsert_card
          disable_card: kickside.models.cards:disable_card
