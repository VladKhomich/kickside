version: "1.0"
namespace: app

# Agent tools over kickside.models.cards:cards. The tools run from the registry
# as shipped, under the scope the card tools policy composes; no provider is
# contacted.

entries:
  - name: card_tools_test
    kind: function.lua
    meta:
      type: test
      suite: kickside_models_card_tools
      comment: Listing, reading, saving, retiring and deleting cards through the card agent tools.
    source: file://test.lua
    modules: [funcs, security, registry]
    method: run
    imports:
      test: wippy.test:test
      models_repo: kickside.models.persist:repo
      model_catalog: kickside.models.catalog:model_catalog
