version: "1.0"
namespace: kickside.workflows
entries:
  - name: dep.kickside.blocks
    version: ">=0.1.43"
    kind: ns.dependency
    meta:
      comment: Canonical typed DAG builders compiled and rendered by the optional visual Flow editor.
    component: kickside/blocks

  - name: dep.kickside.automation
    version: '>=0.2.39'
    kind: ns.dependency
    meta:
      comment: Generic trigger, binding, Flow runtime contract, and Automation web-component surfaces consumed by Workflows.
    component: kickside/automation
    parameters:
      - name: kickside.automation.binding:delete_admission_library
        value: kickside.workflows.binding:automation_delete_admission
      - name: kickside.automation.engine:workflow_history_reader
        value: kickside.workflows.binding:automation_history
