version: "1.0"
namespace: app

# Contract suite for kickside.models.cards:cards. The contract functions run
# from the registry as shipped; no provider is contacted.

entries:
  - name: card_contract_test
    kind: function.lua
    meta:
      type: test
      suite: kickside_models_card_contract
      comment: Registering and retiring a card through the cards contract.
    source: file://test.lua
    modules: [funcs, security, registry, contract]
    method: run
    imports:
      test: wippy.test:test
      models_repo: kickside.models.persist:repo
      model_catalog: kickside.models.catalog:model_catalog
      card_service: kickside.models.catalog:card_service
