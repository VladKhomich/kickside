version: '1.0'
namespace: kickside.models.security
entries:
- name: module_access
  kind: security.policy
  meta:
    title: Models
    surface: kickside.models
    intent: module_access
    includes:
    - kickside.models.security:module_runtime
    - kickside.models.security:models_endpoint_access
    - kickside.models.security:model_resolution
    - kickside.models.security:model_resolution_call
  groups: []
  policy:
    resources:
    - kickside.models:*
    - kickside.models.api:*
    - kickside.models.api.admin:*
    - kickside.models.catalog:*
    - kickside.models.classes:*
    - kickside.models.discovery:*
    - kickside.models.migrations:*
    - kickside.models.persist:*
    - kickside.models.providers:*
    - kickside.models.providers.google_vertex:*
    - kickside.models.providers.openai_compat_plain:*
    - kickside.models.providers.profile:*
    - kickside.models.security:*
    - kickside.models.service:*
    actions:
    - registry.get
    - registry.find
    effect: allow
- name: models_endpoint_access
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.models.api:list_model_classes.endpoint
    - kickside.models.api:list_models.endpoint
    - kickside.models.api:models_by_name.endpoint
    actions: access
    effect: allow
- name: module_runtime
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.models:*
    - kickside.models.api:*
    - kickside.models.api.admin:*
    - kickside.models.catalog:*
    - kickside.models.classes:*
    - kickside.models.discovery:*
    - kickside.models.migrations:*
    - kickside.models.providers:*
    - kickside.models.providers.google_vertex:*
    - kickside.models.providers.openai_compat_plain:*
    - kickside.models.providers.profile:*
    - kickside.models.security:*
    - kickside.models.service:*
    actions:
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
- name: user_security_scope
  kind: ns.requirement
  default: kickside.security.groups:members
  meta:
    value_kind: security.scope
    description: Application group with member access to this module.
  targets:
  - entry: kickside.models.security:module_access
    path: .groups +=
  - entry: kickside.models.security:module_runtime
    path: .groups +=
  - entry: kickside.models.security:models_endpoint_access
    path: .groups +=
  - entry: kickside.models.security:model_resolution
    path: .groups +=
  - entry: kickside.models.security:model_resolution_call
    path: .groups +=
- name: model_resolution
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources: [wippy.llm:model_resolver]
    actions: [contract.get]
    effect: allow
- name: model_resolution_call
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources: [resolve]
    actions: [contract.call]
    effect: allow

- name: card_registrar
  kind: security.policy
  meta:
    title: Model card registration
    comment: Grants a module the kickside.models.cards:cards contract, so it reads, registers, retires and deletes model cards without admin HTTP.
  groups: []
  policy:
    resources:
    - kickside.models.cards:cards
    - kickside.models.cards:cards_binding
    - kickside.models.cards:list_cards
    - kickside.models.cards:get_card
    - kickside.models.cards:upsert_card
    - kickside.models.cards:disable_card
    - kickside.models.cards:delete_card
    - list_cards
    - get_card
    - upsert_card
    - disable_card
    - delete_card
    actions:
    - contract.get
    - contract.open
    - contract.call
    - funcs.call
    - funcs.security
    effect: allow
- name: card_tools
  kind: security.policy
  meta:
    title: Model card tools
    surface: kickside.models
    intent: tool_access
    comment: Grants the Model Card Manager trait and its tools, which list, read, save, retire and delete model cards through the kickside.models.cards:cards contract.
    includes:
    - kickside.models.security:card_tools_runtime
    - kickside.models.security:card_registrar
  groups: []
  policy:
    resources:
    - kickside.models.traits:*
    actions:
    - registry.get
    - registry.find
    effect: allow
- name: card_tools_runtime
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.models.traits:cards_read
    - kickside.models.traits:cards_manage
    actions:
    - funcs.call
    - funcs.security
    effect: allow
