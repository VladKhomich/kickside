version: "1.0"
namespace: app
entries:
  - name: projection_checkpoint_test
    kind: function.lua
    meta: {type: test, suite: core_projection_checkpoint}
    source: file://projection_checkpoint_test.lua
    method: run
    modules: [sql, json, uuid, time, channel]
    imports:
      apply: kickside.core.projections:apply
      claim: kickside.core.jobs.persist:claim
      clock: kickside.core.jobs:clock
      job_types: kickside.core.jobs:types
      jobs: kickside.core.jobs:jobs
      projections: kickside.core.projections.persist:writer
      teardown: kickside.core.threads.persist:teardown_fence
      test: wippy.test:test

  - name: checkpoint_scheduler_worker
    kind: process.lua
    meta: {type: projection.worker, checkpointed_apply: true}
    source: file://projection_checkpoint_scheduler_worker.lua
    method: run
    modules: [sql]
    imports:
      apply: kickside.core.projections:apply
      job_types: kickside.core.jobs:types
      threads: kickside.core.threads.persist:writer

  - name: declared_checkpoint_component
    kind: contract.binding
    meta:
      events:
        input: [{type: "kickside.test.threads:trigger"}]
        output: [{type: "kickside.test.threads:changed"}]
    contracts:
      - contract: kickside.contract:component
        methods: {get_status: "kickside.core.threads:thread_status"}

  - name: declared_checkpoint_descriptor
    kind: registry.entry
    meta:
      impl_id: app:declared_checkpoint_component
      thread: {class: test.declared.checkpoint}
      projections:
        - kind: test.declared.checkpoint
          projection_key: source
          cursor_key: source
          worker_ref: proc://app:declared_checkpoint_worker
          input_mode: prefetch_events
          events:
            input: [{type: "kickside.test.threads:trigger"}]

        - kind: test.declared.checkpoint
          projection_key: ranged
          cursor_key: ranged
          worker_ref: proc://app:range_checkpoint_worker
          input_mode: prefetch_events
          events:
            input: [{type: "kickside.test.threads:trigger"}]

  - name: range_checkpoint_worker
    kind: process.lua
    meta:
      type: projection.worker
      private: true
      checkpointed_apply: true
      filtered_checkpoint: true
      transition_from:
        worker_ref: func://app:test_count_worker
        target_db_config: app:range_checkpoint_database
    source: file://range_checkpoint_worker.lua
    method: run
    imports:
      apply: kickside.core.projections:apply

  - name: checkpoint_alias_component
    kind: contract.binding
    contracts:
      - contract: kickside.contract:component
        methods: {get_status: "kickside.core.threads:thread_status"}

  - name: checkpoint_alias_first
    kind: registry.entry
    meta:
      impl_id: app:checkpoint_alias_component
      thread: {class: test.declared.checkpoint.alias}
      projections:
        - kind: test.declared.checkpoint
          projection_key: ranged
          cursor_key: ranged
          worker_ref: proc://app:range_checkpoint_worker
          input_mode: prefetch_events
          events:
            input: [{type: "kickside.test.threads:trigger"}]

  - name: checkpoint_alias_second
    kind: registry.entry
    meta:
      impl_id: app:checkpoint_alias_component
      thread: {class: test.declared.checkpoint.alias}
      projections:
        - kind: test.declared.checkpoint
          on: thread
          projection_key: ranged
          cursor_key: ranged
          worker_ref: proc://app:range_checkpoint_worker
          input_mode: prefetch_events
          events:
            input: [{type: "kickside.test.threads:trigger"}]
        - kind: test.declared.checkpoint
          projection_key: independent
          cursor_key: independent
          worker_ref: proc://app:range_checkpoint_worker
          input_mode: prefetch_events
          events:
            input: [{type: "kickside.test.threads:changed"}]

  - name: checkpoint_alias_third
    kind: registry.entry
    meta:
      impl_id: app:checkpoint_alias_component
      thread: {class: test.declared.checkpoint.alias}
      projections:
        - kind: test.declared.checkpoint
          projection_key: independent
          cursor_key: independent
          worker_ref: proc://app:range_checkpoint_worker
          input_mode: prefetch_events
          events:
            input: [{type: "kickside.test.threads:trigger"}]

  - name: range_checkpoint_database
    kind: registry.entry
    meta: {db_id: "app:sql_transient_first"}

  - name: declared_checkpoint_worker
    kind: process.lua
    meta:
      type: projection.worker
      private: true
      checkpointed_apply: true
      transition_from:
        worker_ref: func://app:test_count_worker
        shared_db_config: app:projection_transition_database
    source: file://projection_declared_checkpoint_worker.lua
    method: run
    modules: [security, sql]
    imports:
      apply: kickside.core.projections:apply
      job_types: kickside.core.jobs:types

  - name: projection_transition_database
    kind: registry.entry
    meta: {db_id: "app:db"}

  - name: declared_checkpoint_test
    kind: function.lua
    meta: {type: test, suite: core_declared_checkpoint}
    source: file://projection_declared_checkpoint_test.lua
    method: run
    modules: [sql, uuid, json, time, funcs, security]
    imports:
      apply: kickside.core.projections:apply
      claim: kickside.core.jobs.persist:claim
      clock: kickside.core.jobs:clock
      fixture: kickside.core.threads:contract_fixture
      invoke: kickside.core.projections:invoke
      threads: kickside.core.threads.persist:writer
      provision: kickside.core.threads:provision
      projections: kickside.core.projections.persist:writer
      test: wippy.test:test

  - name: checkpoint_declaration_index_fixture
    kind: library.lua
    source: file://projection_checkpoint_index_fixture.lua

  - name: checkpoint_declaration_index_component
    kind: library.lua
    source: file://projection_checkpoint_index_component.lua
    imports:
      fixture: app:checkpoint_declaration_index_fixture

  - name: checkpoint_declaration_index_subject
    kind: library.lua
    source: file://projection_checkpoint_index_subject.lua
    imports:
      autoinit: app:checkpoint_declaration_index_fixture
      component: app:checkpoint_declaration_index_component
      execution_identity: kickside.execution:execution_identity
      register: kickside.core.projections.persist:register
      text_trim: kickside.contract:text_trim

  - name: checkpoint_declaration_index_test
    kind: function.lua
    meta: {type: test, suite: core_declared_checkpoint}
    source: file://projection_checkpoint_index_test.lua
    method: run
    imports:
      declaration: app:checkpoint_declaration_index_subject
      execution_identity: kickside.execution:execution_identity
      fixture: app:checkpoint_declaration_index_fixture
      register: kickside.core.projections.persist:register
      test: wippy.test:test

  - name: checkpoint_scheduler_test
    kind: function.lua
    meta: {type: test, suite: core_checkpoint_scheduler, timeout: 60s}
    source: file://projection_checkpoint_scheduler_test.lua
    method: run
    modules: [process, sql, time, uuid]
    imports:
      jobs: kickside.core.jobs:jobs
      projections: kickside.core.projections.persist:writer
      test: wippy.test:test
      threads: kickside.core.threads.persist:writer

  - name: registered_checkpoint_component
    kind: contract.binding
    meta:
      events:
        input: [{type: "kickside.test.threads:trigger"}]
        output:
          - {type: "kickside.test.threads:changed"}
          - {type: "core.owned.fixture:protected_checkpoint_output", system_only: true}
          - {type: "core.owned.fixture:other_protected_checkpoint_output", system_only: true}
    contracts:
      - contract: kickside.contract:component
        methods: {get_status: "kickside.core.threads:thread_status"}

  - name: registered_checkpoint_test_access
    kind: security.policy
    groups: [app:registered_checkpoint_test_scope]
    policy:
      resources: "*"
      actions: [contract.get, contract.open, contract.call, contract.security, db.get, registry.get, funcs.call, funcs.security, security.policy_group.get]
      effect: allow

  - name: registered_checkpoint_test
    kind: function.lua
    meta: {type: test, suite: core_registered_checkpoint, timeout: 100s}
    source: file://registered_checkpoint_test.lua
    method: run
    modules: [contract, json, process, registry, security, sql, time, uuid]
    imports:
      fixture: kickside.core.threads:contract_fixture
      jobs: kickside.core.jobs:jobs
      projections: kickside.core.projections.persist:writer
      test: wippy.test:test
      threads: kickside.core.threads.persist:writer
