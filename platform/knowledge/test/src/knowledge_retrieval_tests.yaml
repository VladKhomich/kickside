version: "1.0"
namespace: kickside.knowledge.retrieval

entries:
  - name: agentic_query_test
    kind: function.lua
    meta: { type: test, suite: knowledge }
    source: file://agentic_query_test.lua
    method: run
    modules: [registry]
    imports:
      test: wippy.test:test
      agentic_query: kickside.knowledge.retrieval:agentic_query
      agentic_answer_fixture: kickside.knowledge.retrieval:agentic_answer_fixture

  - name: kb_answer_test
    kind: function.lua
    meta: { type: test, suite: knowledge }
    source: file://kb_answer_test.lua
    method: run
    modules: [funcs, security]
    imports:
      test: wippy.test:test
      kb_answer: kickside.knowledge.retrieval:kb_answer
      analysis_model: kickside.knowledge.retrieval:analysis_model
      models_repo: kickside.models.persist:repo

  - name: member_ask_probe
    kind: function.lua
    source: file://kb_answer_test.lua
    method: member_ask
    modules: [funcs, security]
    imports:
      test: wippy.test:test
      kb_answer: kickside.knowledge.retrieval:kb_answer
      analysis_model: kickside.knowledge.retrieval:analysis_model

  - name: member_ask_call
    kind: security.policy
    policy:
      resources: [kickside.knowledge.retrieval:member_ask_probe]
      actions: [funcs.call, funcs.security]
      effect: allow

  - name: member_model_binding
    kind: security.policy
    policy:
      resources: [kickside.models:model_resolver]
      actions: [contract.open]
      effect: allow

  - name: answer_flow_fixture
    kind: library.lua
    source: file://answer_flow_fixture.lua

  - name: agentic_answer_fixture
    kind: library.lua
    source: file://agentic_query_fixture.lua
    imports:
      flow: kickside.knowledge.retrieval:answer_flow_fixture
