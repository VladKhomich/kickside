version: "1.0"
namespace: kickside.uploads
entries:
  - name: upload_type
    kind: library.lua
    meta:
      comment: Library for discovering and validating declarative upload.type entries.
    source: file://../upload_type.lua
    modules: [registry, time]

  - name: types.images
    kind: registry.entry
    meta:
      title: Image Files
      type: upload.type
      comment: Image files for agent viewing and analysis
    type_key: images
    priority: 10
    extension_mime_types:
      jpg: image/jpeg
      jpeg: image/jpeg
      png: image/png
      gif: image/gif
      bmp: image/bmp
      webp: image/webp
      tiff: image/tiff
      tif: image/tiff
      svg: image/svg+xml
      ico: image/x-icon
    mime_types:
      - image/jpeg
      - image/png
      - image/gif
      - image/bmp
      - image/x-ms-bmp
      - image/webp
      - image/tiff
      - image/svg+xml
      - image/x-icon
      - image/vnd.microsoft.icon
    pipeline:
      - title: Processing Image Upload
        func: kickside.uploads.images:processor

  - name: types.text
    kind: registry.entry
    meta:
      title: Text Files
      type: upload.type
      comment: Text and code files including source code, markup, and plain text
    type_key: text
    priority: 10
    extensions: [txt, md, markdown]
    extension_mime_types:
      html: text/html
      htm: text/html
      css: text/css
      js: application/javascript
      json: application/json
      xml: application/xml
      py: text/x-python
      lua: text/x-lua
      rb: text/x-ruby
      php: text/x-php
      java: text/x-java
      c: text/x-c
      cpp: text/x-c++
      cs: text/x-csharp
      go: text/x-go
      sh: text/x-shellscript
      bat: text/x-msdos-batch
      ps1: text/x-powershell
      yml: text/yaml
      yaml: text/yaml
      toml: text/x-toml
      sql: application/sql
      csv: text/csv
      tsv: text/tab-separated-values
    mime_types:
      - text/.*
      - application/json
      - application/javascript
      - application/xml
    pipeline:
      - title: Processing Text Content
        func: kickside.uploads.text:processor
