version: "1.0"
namespace: app.views

entries:
  - name: main
    kind: registry.entry
    meta:
      type: view.page
      title: KickSide
      icon: tabler:layout-dashboard
      order: 0
      announced: true
      secure: false
      mountRoute: /:part(.*)*
      url: /app
      base_path: app/main
      entry_point: app.html
    proxy:
      enabled: true
      css:
        fonts: true
        theme_config: true
        iframe: true
        prime_vue: true
        custom_css: true
        custom_variables: true
      tailwind_config: true
      iconify_icons: true

  - name: managed_coordinator
    kind: registry.entry
    meta:
      type: view.component
      title: KickSide Managed Coordinator
      tag_name: kickside-managed-coordinator
      base_path: app
      entry_point: managed-coordinator.js
      auto_register: true
      announced: true
      secure: false
    props:
      type: object
      properties:
        component:
          type: string
