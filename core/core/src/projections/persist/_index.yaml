version: "1.0"
namespace: kickside.core.projections.persist

entries:
  # Persistence + engine layer of the projections slice: projection/cursor reads
  # and writes, the catch-up loop, and the generic worker boundary it drives.
  # Shared vocabulary (types) and the runtime policy reader live in the slice root
  # (kickside.core.projections).

  - name: worker
    kind: library.lua
    meta:
      comment: Worker_ref parse/validate + generic func:// / proc:// worker invocation (supervised proc execution).
    source: file://worker.lua
    modules:
      - sql
      - json
      - funcs
      - registry
      - security
      - process
      - time
    imports:
      text_trim: kickside.contract:text_trim
      event_access: kickside.core.threads:event_access
      types: kickside.core.projections:types
      execution_identity: kickside.execution:execution_identity
      trace_context: kickside.execution:trace
      persisted_json: kickside.contract:persisted_json
      proc_supervisor: kickside.core.jobs:proc_supervisor
      projection_policy: kickside.core.projections:policy_config
      error_envelope: kickside.contract:error_envelope
      job_types: kickside.core.jobs:types
      checkpoint_declaration: kickside.core.projections.persist:checkpoint_declaration
      registered_checkpoint: kickside.core.projections.persist:registered_checkpoint
      core_db: kickside.core:db

  - name: registered_checkpoint
    kind: library.lua
    source: file://registered_checkpoint.lua
    modules: [sql, json, registry, security, process]
    imports:
      canonical_json: kickside.contract:canonical_json
      access_subjects: kickside.component.persist:access_subjects
      component_query: kickside.component.persist:component_query
      component_types: kickside.component:types
      event_access: kickside.core.threads:event_access
      execution_identity: kickside.execution:execution_identity
      jobs_config: kickside.core.jobs:config
      core_types: kickside.core:types
      registration: kickside.core.projections.persist:register
      text_trim: kickside.contract:text_trim
      owned_worker: kickside.core.projections.persist:owned_worker

  - name: checkpoint_declaration
    kind: library.lua
    meta:
      comment: Check a private checkpoint against its owning primary-thread declaration.
    source: file://checkpoint_declaration.lua
    imports:
      autoinit: kickside.component:autoinit
      component: kickside.component:component
      execution_identity: kickside.execution:execution_identity
      register: kickside.core.projections.persist:register
      text_trim: kickside.contract:text_trim

  - name: owned_worker
    kind: library.lua
    meta:
      comment: Admit a component's exact installed materializer with an isolated effect scope.
    source: file://owned_worker.lua
    modules: [security]
    imports:
      autoinit: kickside.component:autoinit
      event_access: kickside.core.threads:event_access
      lifecycle: kickside.core.lifecycle:consts
      register: kickside.core.projections.persist:register
      text_trim: kickside.contract:text_trim

  - name: reader
    kind: library.lua
    meta:
      comment: Projection + cursor reads (list, get, find_cursor).
    source: file://reader.lua
    modules:
      - sql
    imports:
      text_trim: kickside.contract:text_trim
      types: kickside.core.projections:types
      event_access: kickside.core.threads:event_access

  - name: register
    kind: library.lua
    meta:
      comment: Projection registration and cursor slot creation in one transaction.
    source: file://register.lua
    modules: [sql, json, uuid, registry]
    imports:
      autoinit: kickside.component:autoinit
      text_trim: kickside.contract:text_trim
      core_db: kickside.core:db
      jobs_config: kickside.core.jobs:config
      event_access: kickside.core.threads:event_access
      clock: kickside.core.jobs:clock
      types: kickside.core.projections:types
      core_types: kickside.core:types
      execution_identity: kickside.execution:execution_identity
      job_lifecycle: kickside.core.jobs.persist:lifecycle
      jobs_wake: kickside.core.jobs.persist:wake
      retention_notifier: kickside.core.retention:notifier
      retention_pin: kickside.core.retention:pin
      persisted_json: kickside.contract:persisted_json
      sql_boundary: kickside.core.jobs.persist:sql_boundary
      committed_error: kickside.contract:committed_error

  - name: writer
    kind: library.lua
    meta:
      comment: Projection + cursor writes (register, remove, pause, resume).
    source: file://writer.lua
    modules:
      - sql
    imports:
      text_trim: kickside.contract:text_trim
      event_access: kickside.core.threads:event_access
      reader: kickside.core.projections.persist:reader
      clock: kickside.core.jobs:clock
      register: kickside.core.projections.persist:register
      job_reclaim: kickside.core.jobs.persist:reclaim
      job_lifecycle_cancel: kickside.core.jobs.persist:lifecycle_cancel
      jobs_wake: kickside.core.jobs.persist:wake
      cursor_waiters: kickside.core.threads:cursor_waiters
      retention_notifier: kickside.core.retention:notifier
      retention_pin: kickside.core.retention:pin
      sql_boundary: kickside.core.jobs.persist:sql_boundary
      error_envelope: kickside.contract:error_envelope
      committed_error: kickside.contract:committed_error

  - name: page_cursor
    kind: library.lua
    source: file://page_cursor.lua
    modules: [json, base64]
    imports:
      canonical_json: kickside.contract:canonical_json
