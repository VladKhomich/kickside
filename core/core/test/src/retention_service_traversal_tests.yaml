version: "1.0"
namespace: app
entries:
  - name: retention_service_traversal_fixture
    kind: library.lua
    source: file://retention_service_traversal_fixture.lua
    modules: [time]
    imports:
      native: app:retention_process_native_fixture
      prune_scaffold: app:prune_scaffold

  - name: retention_service_traversal_owner
    kind: library.lua
    source: file://retention_service_traversal_owner.lua
    imports:
      fixture: app:retention_service_traversal_fixture
      owner_hooks: kickside.core.retention.service:owner_hooks

  - name: retention_service_traversal_clock
    kind: library.lua
    source: file://retention_service_traversal_clock.lua
    imports:
      fixture: app:retention_service_traversal_fixture

  - name: retention_service_traversal_runner
    kind: library.lua
    source: file://retention_service_traversal_runner_source.lua
    modules: [sql, logger]
    imports:
      process: app:retention_service_traversal_fixture
      sweeper: app:retention_service_traversal_sweeper
      owner_hooks: app:retention_service_traversal_owner

  - name: retention_service_traversal_sweeper
    kind: library.lua
    source: file://retention_sweeper_native_source.lua
    modules: [sql]
    imports:
      time: app:retention_service_traversal_clock
      clock: kickside.core.jobs:clock
      prune: kickside.core.retention:prune
      receipt_purge: kickside.core:write_receipt_purge
      retention_policy: kickside.core:policy_config

  - name: retention_service_traversal_process
    kind: library.lua
    source: file://retention_process_native_source.lua
    imports:
      time: app:retention_service_traversal_clock
      process: app:retention_process_native_process_adapter
      sql: app:retention_service_traversal_sql
      channel: app:retention_service_traversal_fixture
      events: app:retention_process_native_events_adapter
      proc_supervisor: app:retention_process_native_supervisor_adapter
      runner: app:retention_service_traversal_runner
      core_db: kickside.core:db
      notifier: kickside.core.retention:notifier
      lease_release: kickside.core.jobs:lease_release

  - name: retention_service_traversal_test
    kind: function.lua
    meta: {type: test, suite: core_retention_service_traversal}
    source: file://retention_service_traversal_test.lua
    method: run
    modules: [time, uuid, process, channel]
    imports:
      test: wippy.test:test
      fixture: app:retention_service_traversal_fixture
      prune_scaffold: app:prune_scaffold
      source: app:retention_service_traversal_process
      lifecycle: kickside.core.threads.persist:lifecycle
      lifecycle_impl: kickside.core.lifecycle:component_lifecycle_impl
      notifier: kickside.core.retention:notifier
      receipts: kickside.core:write_receipt
      pin: kickside.core.retention:pin
      retention_repo: kickside.core.retention.persist:repo

  - name: retention_service_traversal_sql
    kind: library.lua
    source: file://retention_service_traversal_sql.lua
    modules: [sql]
    imports:
      fixture: app:retention_service_traversal_fixture
